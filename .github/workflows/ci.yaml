name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

#
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
          registry-url: https://registry.npmjs.org
      - name: Configure Yarn registry and network timeout
        run: |
          yarn config set registry https://registry.npmjs.org
          yarn config set network-timeout 300000
      - name: Install dependencies (retry on transient registry failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "yarn install attempt ${attempt}/3"
            if yarn install --frozen-lockfile --network-timeout 300000; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          echo "yarn install failed after 3 attempts"
          exit 1
      - name: Run tests and collect coverage
        run: yarn prepare
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
